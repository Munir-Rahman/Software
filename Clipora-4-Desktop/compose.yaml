services:
  clipora:
    build: .
    restart: unless-stopped
    init: true
    # Bind only to the VPS loopback; front with an HTTPS reverse proxy.
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      ACCESS_PASSWORD: ${ACCESS_PASSWORD:?Set a strong ACCESS_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set a 32+ character SESSION_SECRET in .env}
      MAX_DOWNLOAD_MB: ${MAX_DOWNLOAD_MB:-2048}
      MAX_TOTAL_MB: ${MAX_TOTAL_MB:-10240}
      MAX_CONCURRENT: ${MAX_CONCURRENT:-2}
      FILE_TTL_HOURS: ${FILE_TTL_HOURS:-2}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 2g
    cpus: 2
    volumes:
      - clipora_data:/app/server/runtime
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  clipora_data:
